services:
  postgres:
    image: postgres:16.10-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kirindesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kirindesk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kirindesk_dev}
    volumes:
      - kirindesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kirindesk}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kirindesk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kirindesk}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kirindesk_dev_secret}
    volumes:
      - kirindesk_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      S3_BUCKET: ${S3_BUCKET:-kirindesk-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kirindesk}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kirindesk_dev_secret}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  kirindesk_pgdata:
  kirindesk_redis:
  kirindesk_minio:
