name: quality-gate

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_DB_PASSWORD: kirindesk_app_dev_password
      TEST_DATABASE_URL: postgresql://kirindesk:kirindesk_dev_password@127.0.0.1:5432/kirindesk_test
      TEST_APP_DATABASE_URL: postgresql://kirindesk_app:kirindesk_app_dev_password@127.0.0.1:5432/kirindesk_test
      REDIS_URL: redis://127.0.0.1:6379/1
      TENANT_JWT_SECRET: ci-tenant-jwt-secret-not-for-production
      PLATFORM_JWT_SECRET: ci-platform-jwt-secret-not-for-production

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: docker compose up -d --wait postgres redis minio
      - run: docker compose run --rm minio-init
      - run: pnpm verify:full
      - run: pnpm verify:release
      - if: always()
        run: docker compose logs --no-color postgres redis minio minio-init
