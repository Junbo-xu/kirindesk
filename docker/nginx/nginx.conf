# Phase 3A — nginx site config for the KirinDesk web container.
# Serves the static SPA and reverse-proxies /api to the API container so the
# whole app is same-origin (the frontend uses relative /api paths unchanged).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API. `api` is the service name in docker-compose.prod.yml;
    # 3001 is API_PORT. Forward the real client IP so the API's signup rate
    # limiter (which keys on IP when TRUST_PROXY=true) sees the right address.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
